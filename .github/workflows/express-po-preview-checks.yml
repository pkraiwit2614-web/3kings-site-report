name: Express PO Preview Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/express-po/**'
      - 'app/api/sync/express-po/**'
      - 'app/api/materials/express-po/**'
      - 'app/api/materials/express-register/**'
      - 'components/ExpressPoSection.tsx'
      - 'components/ExpressRegisterSection.tsx'
      - 'tests/express-register-security.test.cjs'
      - 'app/materials/page.tsx'
      - 'tests/express-po-*.test.cjs'
      - 'tests/express-bridge-*.test.cjs'
      - 'docs/apps-script/ExpressBridge*.gs'
      - '.github/workflows/express-po-preview-checks.yml'
jobs:
  parser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic parser, delta and isolated atomic staging
        run: node --test tests/express-po-parser.test.cjs tests/express-po-staging.test.cjs tests/express-po-materials-security.test.cjs tests/express-po-delta.test.cjs tests/express-po-atomic-staging.test.cjs tests/express-po-source-selection.test.cjs tests/express-po-master-delta.test.cjs tests/express-register-security.test.cjs tests/express-bridge-*.test.cjs
