name: 3 Kings Release Watch (read-only)

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/3kings-release-watch.yml'
      - 'scripts/release-policy.mjs'
      - 'scripts/release-watch.mjs'
      - 'tests/release-policy.test.mjs'
      - 'config/release-queue.json'
      - 'docs/release-controller.md'

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  deployments: read

concurrency:
  group: 3kings-release-watch
  cancel-in-progress: false

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/release-policy.test.mjs
  observe:
    needs: policy-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Audit queue without altering any PR or deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KINGS_VERCEL_READ_TOKEN: ${{ secrets.KINGS_VERCEL_READ_TOKEN }}
          KINGS_VERCEL_PROJECT_ID: ${{ vars.KINGS_VERCEL_PROJECT_ID }}
          KINGS_VERCEL_TEAM_ID: ${{ vars.KINGS_VERCEL_TEAM_ID }}
          KINGS_VERCEL_PRODUCTION_ALIAS: ${{ vars.KINGS_VERCEL_PRODUCTION_ALIAS }}
        run: node scripts/release-watch.mjs
