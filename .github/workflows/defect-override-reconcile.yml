name: Defect Override Reconciliation SQL

on:
  push:
    branches:
      - fix/defect-override-reconcile-20261019
      - resume_three_kings_issue_230
      - sync_room_b515_defect
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*defect_override_field_reconcile.sql'
      - 'supabase/migrations/20261027233000_b515_defect_sync_reconcile.sql'
      - 'tests/sql/defect-override-reconcile-*.sql'
      - 'tests/sql/b515-defect-sync-*.sql'
      - '.github/workflows/defect-override-reconcile.yml'

permissions:
  contents: read

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres_version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: defect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d defect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: defect_test
    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Create synthetic schema + exact old trigger fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/defect-override-reconcile-fixture.sql

      - name: Apply reconciliation migration in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261019132800_defect_override_field_reconcile_20261019.sql

      - name: Test pending synced conflict baseline history and restricted rooms
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/defect-override-reconcile-assertions.sql

      - name: Apply B515 scoped migration and execute assertions, regressions and tested rollback
        run: |
          set -euo pipefail
          # Ensure condo_room_status has required production columns for B515 assertions
          psql -X -v ON_ERROR_STOP=1 -c "
            ALTER TABLE public.condo_room_status
              ADD COLUMN IF NOT EXISTS building text,
              ADD COLUMN IF NOT EXISTS floor integer,
              ADD COLUMN IF NOT EXISTS hotel_participation text,
              ADD COLUMN IF NOT EXISTS customer_status text,
              ADD COLUMN IF NOT EXISTS follow_up text,
              ADD COLUMN IF NOT EXISTS priority text,
              ADD COLUMN IF NOT EXISTS source_note text,
              ADD COLUMN IF NOT EXISTS hotel_complete_color text,
              ADD COLUMN IF NOT EXISTS hotel_remarks text;"
          # Pre-seed B515 room in condo_room_status so preflight passes
          psql -X -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.condo_room_status (
              room_no, current_status, status_group, next_action, defect_detail, latest_source,
              source_file_id, source_file_name, source_modified_at
            ) VALUES (
              'B515', 'Defect เสร็จแล้ว / รอ Hotel Engineer ตรวจ', 'Hotel - Awaiting Check',
              'รอตรวจยืนยัน', 'Initial B515 detail', 'Prior',
              '1MEeB1E7D_35MTndRPi1aBTlVfI2aR0Wj', 'Handover_Defect_Summary_Updated_28-09-2026.xlsx',
              '2026-10-25 08:00:00+00'
            ) ON CONFLICT (room_no) DO NOTHING;"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261027233000_b515_defect_sync_reconcile.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/b515-defect-sync-reconcile-assertions.sql
          echo "PASS: B515 migration, SQL assertions, regressions and rollback verified on PostgreSQL ${{ matrix.postgres_version }}"
