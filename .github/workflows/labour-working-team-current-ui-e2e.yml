name: Labour Working Team Current UI E2E

on:
  push:
    branches:
      - fix/labour-working-team-default-20261005-r2
    paths:
      - '.github/workflows/labour-working-team-current-ui-e2e.yml'
      - 'app/reports/labour/page.tsx'

permissions:
  contents: read

jobs:
  browser-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://woqbxlhikzhhoaiinwqf.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Bg2m2kErq2n8q_jO9LXe5w_U5_29Yrq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and build exact branch
        run: |
          npm install
          npm run build
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact branch locally
        shell: bash
        run: |
          set -euo pipefail
          (npm run start -- -p 3000 > /tmp/3kings-next.log 2>&1 & echo $! > /tmp/3kings-next.pid)
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL/reports/labour" >/dev/null; then
              echo "Local Next.js ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3kings-next.log
          exit 42

      - name: Run browser UI E2E against exact branch
        shell: bash
        run: |
          cat > labour-current-ui-e2e.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const base = process.env.APP_URL
          const supabaseOrigin = 'https://woqbxlhikzhhoaiinwqf.supabase.co'
          const projectId = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          const engineerId = '33333333-3333-4333-8333-333333333333'
          const viewerId = '44444444-4444-4444-8444-444444444444'
          const storageKey = 'sb-woqbxlhikzhhoaiinwqf-auth-token'
          const results = []
          const rpcCalls = []

          const workers = [
            {worker_id:'W027',full_name:'Synthetic Worker W027',nickname:'W027',default_team:'ช่างตุ๊ก',status:'Active',display_label:'W027 Synthetic'},
            {worker_id:'W034',full_name:'Synthetic Worker W034',nickname:'W034',default_team:'ทีมช่างปาล์มคุมกะรน',status:'Active',display_label:'W034 Synthetic'},
          ]
          const entries = [
            {id:'a0000000-0000-4000-8000-000000000027',work_date:'2026-10-04',source_row:27,project_name_raw:'PTEST',area_raw:'Case W027',supervisor_raw:'Synthetic Supervisor',male_count:1,female_count:0,total_manpower:1,work_detail:'Borrow W027 to ช่างต้อย',status_text:'TEST',next_plan:null,afternoon_detail:null,specific_area:null,source_fingerprint:'fp-027',supervisor_worker_id:null},
            {id:'a0000000-0000-4000-8000-000000000034',work_date:'2026-10-04',source_row:34,project_name_raw:'PTEST',area_raw:'Case W034',supervisor_raw:'Synthetic Supervisor',male_count:1,female_count:0,total_manpower:1,work_detail:'Borrow W034 to ช่างพร',status_text:'TEST',next_plan:null,afternoon_detail:null,specific_area:null,source_fingerprint:'fp-034',supervisor_worker_id:null},
            {id:'a0000000-0000-4000-8000-000000000127',work_date:'2026-10-04',source_row:127,project_name_raw:'PTEST',area_raw:'Same Team',supervisor_raw:'Synthetic Supervisor',male_count:1,female_count:0,total_manpower:1,work_detail:'W027 same home team',status_text:'TEST',next_plan:null,afternoon_detail:null,specific_area:null,source_fingerprint:'fp-127',supervisor_worker_id:null},
            {id:'a0000000-0000-4000-8000-000000000227',work_date:'2026-10-04',source_row:227,project_name_raw:'PTEST',area_raw:'Returned',supervisor_raw:'Synthetic Supervisor',male_count:1,female_count:0,total_manpower:1,work_detail:'W027 returned home',status_text:'TEST',next_plan:null,afternoon_detail:null,specific_area:null,source_fingerprint:'fp-227',supervisor_worker_id:null},
            {id:'a0000000-0000-4000-8000-000000000999',work_date:'2026-10-04',source_row:999,project_name_raw:'PTEST',area_raw:'Unknown Team',supervisor_raw:'Synthetic Supervisor',male_count:1,female_count:0,total_manpower:1,work_detail:'Unknown working team block case',status_text:'TEST',next_plan:null,afternoon_detail:null,specific_area:null,source_fingerprint:'fp-999',supervisor_worker_id:null},
          ]
          const batches = [
            {id:'b0000000-0000-4000-8000-000000000027',site_operations_entry_id:entries[0].id,work_date:'2026-10-04',expected_headcount:1,confirmed_headcount:1,confirmed_headcount_basis:'source_total',confirmed_headcount_evidence:null,headcount_source_status:'matched',headcount_confirmation_status:'confirmed',headcount_confirmed_at:'2026-10-04T00:00:00.000Z',supervisor_worker_id:null,supervisor_raw:'Synthetic Supervisor',home_team:'ช่างต้อย',verification_status:'pending',verified_by:null,verified_at:null,verified_source_fingerprint:null,note:null},
            {id:'b0000000-0000-4000-8000-000000000034',site_operations_entry_id:entries[1].id,work_date:'2026-10-04',expected_headcount:1,confirmed_headcount:1,confirmed_headcount_basis:'source_total',confirmed_headcount_evidence:null,headcount_source_status:'matched',headcount_confirmation_status:'confirmed',headcount_confirmed_at:'2026-10-04T00:00:00.000Z',supervisor_worker_id:null,supervisor_raw:'Synthetic Supervisor',home_team:'ช่างพร',verification_status:'pending',verified_by:null,verified_at:null,verified_source_fingerprint:null,note:null},
            {id:'b0000000-0000-4000-8000-000000000127',site_operations_entry_id:entries[2].id,work_date:'2026-10-04',expected_headcount:1,confirmed_headcount:1,confirmed_headcount_basis:'source_total',confirmed_headcount_evidence:null,headcount_source_status:'matched',headcount_confirmation_status:'confirmed',headcount_confirmed_at:'2026-10-04T00:00:00.000Z',supervisor_worker_id:null,supervisor_raw:'Synthetic Supervisor',home_team:'ช่างตุ๊ก',verification_status:'pending',verified_by:null,verified_at:null,verified_source_fingerprint:null,note:null},
            {id:'b0000000-0000-4000-8000-000000000227',site_operations_entry_id:entries[3].id,work_date:'2026-10-04',expected_headcount:1,confirmed_headcount:1,confirmed_headcount_basis:'source_total',confirmed_headcount_evidence:null,headcount_source_status:'matched',headcount_confirmation_status:'confirmed',headcount_confirmed_at:'2026-10-04T00:00:00.000Z',supervisor_worker_id:null,supervisor_raw:'Synthetic Supervisor',home_team:'ช่างตุ๊ก',verification_status:'pending',verified_by:null,verified_at:null,verified_source_fingerprint:null,note:null},
            {id:'b0000000-0000-4000-8000-000000000999',site_operations_entry_id:entries[4].id,work_date:'2026-10-04',expected_headcount:1,confirmed_headcount:1,confirmed_headcount_basis:'source_total',confirmed_headcount_evidence:null,headcount_source_status:'matched',headcount_confirmation_status:'confirmed',headcount_confirmed_at:'2026-10-04T00:00:00.000Z',supervisor_worker_id:null,supervisor_raw:'Synthetic Supervisor',home_team:null,verification_status:'pending',verified_by:null,verified_at:null,verified_source_fingerprint:null,note:null},
          ]
          const project = {id:projectId,code:'PTEST',name:'Synthetic Labour E2E',site_group:'TEST',target_handover:null,active:true,sort_order:1}
          const entryProjects = entries.map(e=>({entry_id:e.id,project_id:projectId}))
          const assignments = []

          function assert(cond, message) {
            if (!cond) throw new Error(message)
          }
          function fakeJwt(sub) {
            const b64 = obj => Buffer.from(JSON.stringify(obj)).toString('base64url')
            return b64({alg:'HS256',typ:'JWT'})+'.'+b64({sub,role:'authenticated',exp:4102444800})+'.stub'
          }
          function authUser(id, email) {
            const now='2026-10-04T00:00:00.000Z'
            return {id,aud:'authenticated',role:'authenticated',email,email_confirmed_at:now,confirmed_at:now,last_sign_in_at:now,app_metadata:{provider:'email',providers:['email']},user_metadata:{},identities:[],created_at:now,updated_at:now,is_anonymous:false}
          }
          function session(id,email){
            const user=authUser(id,email)
            return {access_token:fakeJwt(id),token_type:'bearer',expires_in:3600,expires_at:4102444800,refresh_token:'stub-refresh',user}
          }
          function json(route, body, status=200, extra={}) {
            const contentRange=Array.isArray(body)?(body.length?`0-${body.length-1}/${body.length}`:'*/0'):'0-0/1'
            return route.fulfill({status,contentType:'application/json',body:JSON.stringify(body),headers:{'content-range':contentRange,'access-control-expose-headers':'Content-Range','access-control-allow-origin':'*',...extra}})
          }
          async function installMocks(context, appRole) {
            const uid=appRole==='viewer'?viewerId:engineerId
            const email=appRole==='viewer'?'viewer-ui-e2e@example.invalid':'engineer-ui-e2e@example.invalid'
            await context.addInitScript(({storageKey,value})=>localStorage.setItem(storageKey,value),{storageKey,value:JSON.stringify(session(uid,email))})
            await context.route('**/api/access-control?**', async route => {
              return route.fulfill({
                status:200,
                contentType:'application/json',
                body:JSON.stringify({allowed:true,role:appRole==='viewer'?'viewer':'admin',redirect:null})
              })
            })
            await context.route(supabaseOrigin+'/**', async route => {
              const req=route.request()
              const u=new URL(req.url())
              const path=u.pathname
              console.log('SUPABASE_REQUEST',req.method(),path,'range='+String(req.headers()['range']||''),'prefer='+String(req.headers()['prefer']||''),u.search)

              if(path==='/auth/v1/user'){
                return json(route,authUser(uid,email))
              }
              if(path==='/auth/v1/logout'){
                return json(route,{})
              }

              if(path==='/rest/v1/profiles'){
                return json(route,{full_name:appRole==='viewer'?'Synthetic Viewer':'Synthetic Engineer',role:appRole,active:true})
              }
              if(path==='/rest/v1/site_operations_entries') return json(route,entries)
              if(path==='/rest/v1/labour_verification_batches') return json(route,batches)
              if(path==='/rest/v1/labour_workers') return json(route,workers)
              if(path==='/rest/v1/projects') return json(route,[project])
              if(path==='/rest/v1/site_operations_entry_projects') return json(route,entryProjects)
              if(path==='/rest/v1/labour_daily_assignments') return json(route,assignments)
              if(path==='/rest/v1/payroll_verification_records') return json(route,[])
              if(path==='/rest/v1/payroll_verification_items') return json(route,[])
              if(path==='/rest/v1/drive_sync_runs') return json(route,[])
              if(path==='/rest/v1/v_schedule_tasks') return json(route,[])

              if(path==='/rest/v1/rpc/labour_verify_batch'){
                const body=req.postDataJSON()
                rpcCalls.push(body)
                const batch=batches.find(x=>x.id===body.p_batch_id)
                assert(batch,'RPC referenced unknown batch '+body.p_batch_id)
                batch.verification_status='verified'
                batch.verified_by=uid
                batch.verified_at='2026-10-04T03:00:00.000Z'
                batch.verified_source_fingerprint=entries.find(e=>e.id===batch.site_operations_entry_id)?.source_fingerprint||null
                batch.note=body.p_note||null
                for(let i=assignments.length-1;i>=0;i--) if(assignments[i].batch_id===batch.id) assignments.splice(i,1)
                for(const a of body.p_assignments||[]){
                  const worker=workers.find(w=>w.worker_id===a.worker_id)
                  assignments.push({
                    id:'assign-'+batch.id+'-'+a.worker_id,
                    batch_id:batch.id,
                    worker_id:a.worker_id,
                    work_date:batch.work_date,
                    project_id:a.project_id||null,
                    home_team:worker?.default_team||null,
                    working_team:a.working_team||worker?.default_team||null,
                    movement_status:a.movement_status||'same_team',
                    allocation_hours:a.allocation_hours??null,
                    allocation_share:null,
                    work_detail:entries.find(e=>e.id===batch.site_operations_entry_id)?.work_detail||null,
                    notes:a.notes||null,
                    verified_at:batch.verified_at,
                  })
                }
                return json(route,body.p_assignments?.length||0)
              }

              console.log('UNHANDLED_SUPABASE_REQUEST',req.method(),req.url())
              return json(route,{message:'unhandled test route'},500)
            })
          }

          async function card(page, marker) {
            const c=page.locator('article.labour-card').filter({hasText:marker})
            await c.waitFor({state:'visible',timeout:15000})
            return c
          }
          async function addWorker(c, workerId) {
            await c.locator('.labour-tools select').selectOption(workerId)
            await c.getByRole('button',{name:'เพิ่มคน'}).click()
          }
          async function field(c,label) {
            return c.locator('label').filter({hasText:label}).locator('select').inputValue()
          }
          async function save(c) {
            await c.getByRole('button',{name:/ยืนยันทีมคนงาน|ยืนยันการแก้ไข/}).click()
            await c.getByText('ยืนยันทีมแล้ว').waitFor({state:'visible',timeout:15000})
          }

          const browser=await chromium.launch()
          try{
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}})
            await installMocks(ctx,'engineer')
            const page=await ctx.newPage()
            const browserErrors=[]
            page.on('console',m=>{if(m.type()==='error') browserErrors.push(m.text())})
            await page.goto(base+'/reports/labour?date=2026-10-04',{waitUntil:'domcontentloaded'})
            await page.getByText('Labour & Payroll Verification').waitFor({state:'visible',timeout:15000})
            await page.getByText('กำลังโหลดข้อมูล…').waitFor({state:'detached',timeout:15000}).catch(()=>{})
            console.log('BODY_BEFORE_CARD', (await page.locator('body').innerText()).slice(0,12000))

            {
              const c=await card(page,'Case W027')
              await addWorker(c,'W027')
              const working=await field(c,'ทีมที่ทำงานจริง')
              const movement=await field(c,'การย้ายทีม')
              assert(working==='ช่างต้อย','W027 working team expected ช่างต้อย got '+working)
              assert(movement==='borrowed','W027 movement expected borrowed got '+movement)
              assert((await c.locator('.labour-person-name').innerText()).includes('Home: ช่างตุ๊ก'),'W027 home team changed in UI')
              await save(c)
              const call=rpcCalls.find(x=>x.p_batch_id==='b0000000-0000-4000-8000-000000000027')
              assert(call?.p_assignments?.[0]?.working_team==='ช่างต้อย','W027 RPC payload working_team wrong')
              assert(call?.p_assignments?.[0]?.movement_status==='borrowed','W027 RPC payload movement wrong')
              results.push({case:'W027 borrowed',working,movement,payload:call.p_assignments[0],status:'PASS'})
            }

            {
              const c=await card(page,'Case W034')
              await addWorker(c,'W034')
              const working=await field(c,'ทีมที่ทำงานจริง')
              const movement=await field(c,'การย้ายทีม')
              assert(working==='ช่างพร','W034 working team expected ช่างพร got '+working)
              assert(movement==='borrowed','W034 movement expected borrowed got '+movement)
              assert((await c.locator('.labour-person-name').innerText()).includes('Home: ทีมช่างปาล์มคุมกะรน'),'W034 home team changed in UI')
              await save(c)
              results.push({case:'W034 borrowed',working,movement,status:'PASS'})
            }

            {
              const c=await card(page,'Same Team')
              await addWorker(c,'W027')
              const working=await field(c,'ทีมที่ทำงานจริง')
              const movement=await field(c,'การย้ายทีม')
              assert(working==='ช่างตุ๊ก','same-team working team wrong')
              assert(movement==='same_team','same-team movement wrong')
              await save(c)
              results.push({case:'same team',working,movement,status:'PASS'})
            }

            {
              const c=await card(page,'Returned')
              await addWorker(c,'W027')
              const initial=await field(c,'การย้ายทีม')
              assert(initial==='same_team','returned must not be inferred automatically')
              await c.locator('label').filter({hasText:'การย้ายทีม'}).locator('select').selectOption('returned')
              await save(c)
              await page.reload({waitUntil:'domcontentloaded'})
              const reloaded=await card(page,'Returned')
              await reloaded.getByRole('button',{name:/โหลดชุดที่ยืนยันไว้/}).click()
              const persisted=await field(reloaded,'การย้ายทีม')
              assert(persisted==='returned','manual returned did not persist after reload')
              results.push({case:'manual returned preserved',initial,persisted,status:'PASS'})
            }

            {
              const c=await card(page,'Unknown Team')
              await addWorker(c,'W027')
              await page.getByText('ยังไม่ทราบทีมที่ทำงานจริงของชุดนี้ • กรุณาตรวจ/ยืนยันทีมก่อนเพิ่มคน').waitFor({state:'visible'})
              assert(await c.locator('.labour-person').count()===0,'unknown working team created a draft instead of blocking')
              results.push({case:'unknown team blocks guessing',status:'PASS'})
            }

            assert(browserErrors.length===0,'browser console errors: '+browserErrors.join(' | '))
            await page.screenshot({path:'labour-current-ui-pass.png',fullPage:true})
            await ctx.close()

            const viewerCtx=await browser.newContext({viewport:{width:1280,height:900}})
            await installMocks(viewerCtx,'viewer')
            const viewer=await viewerCtx.newPage()
            await viewer.goto(base+'/reports/labour?date=2026-10-04',{waitUntil:'domcontentloaded'})
            await viewer.getByText('บัญชีนี้ดูข้อมูลได้ แต่การยืนยัน/แก้ทีมคนงานสงวนไว้สำหรับ Manager, Engineer หรือ Payroll').waitFor({state:'visible',timeout:15000})
            const addButtons=viewer.getByRole('button',{name:'เพิ่มคน'})
            const count=await addButtons.count()
            for(let i=0;i<count;i++) assert(await addButtons.nth(i).isDisabled(),'viewer has enabled add worker button')
            results.push({case:'viewer read-only',status:'PASS'})
            await viewerCtx.close()

            fs.writeFileSync('labour-current-ui-results.json',JSON.stringify({status:'PASS',results,rpcCalls},null,2))
            console.log(JSON.stringify({status:'PASS',results,rpcCalls},null,2))
          }catch(err){
            try{console.log('BODY_ON_FAILURE',(await (await browser.contexts()[0]?.pages()[0])?.locator('body').innerText())?.slice(0,12000))}catch{}
            fs.writeFileSync('labour-current-ui-results.json',JSON.stringify({status:'FAIL',error:String(err?.stack||err),results,rpcCalls},null,2))
            console.error(err)
            throw err
          }finally{
            await browser.close()
          }
          EOF
          node labour-current-ui-e2e.mjs

      - name: Upload UI E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labour-working-team-current-ui-e2e
          path: |
            labour-current-ui-results.json
            labour-current-ui-pass.png
          if-no-files-found: ignore
