name: SOP 09 Photo Fast-Track (isolated)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'scripts/progress_photo_fasttrack.py'
      - 'tests/test_progress_photo_fasttrack.py'
      - '.github/workflows/photo-progress-fasttrack.yml'
      - 'docs/photo-progress-fasttrack.md'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Inventory is safe default; apply runs read + verified rename + readback in one execution
        options: [inventory, dry-run, apply]
        default: inventory
      max_days:
        description: Candidate-bearing days per Plot (0 = all)
        required: true
        default: '4'
      max_renames:
        description: Maximum independently verified filenames allowed to change (default one)
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: photo-fasttrack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -p 'test_progress_photo_fasttrack.py' -v

  drive-inventory-acceptance:
    # No live Drive secrets for arbitrary PRs. Owner approval is required by a
    # preconfigured GitHub Environment; without the label this job is SKIPPED.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 209 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/206-photo-fasttrack-safe-executor-20261021' &&
      contains(github.event.pull_request.labels.*.name, 'photo-live-qa')
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: photo-inventory-qa
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate via Google Workload Identity Federation (no private key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PHOTO_WIF_PROVIDER }}
          service_account: ${{ vars.PHOTO_SA_EMAIL }}
          create_credentials_file: true
      - run: python -m pip install google-api-python-client google-auth
      - name: Read-only live SOP and complete Plot/day metadata inventory (no image media or rename)
        env:
          PHOTO_PLOT_FOLDERS_JSON: ${{ secrets.PHOTO_PLOT_FOLDERS_JSON }}
          PHOTO_ROOT_FOLDER_ID: ${{ secrets.PHOTO_ROOT_FOLDER_ID }}
          PHOTO_SOP_INDEX_ID: ${{ secrets.PHOTO_SOP_INDEX_ID }}
          PHOTO_SOP_DOC_ID: ${{ secrets.PHOTO_SOP_DOC_ID }}
        run: python scripts/progress_photo_fasttrack.py --inventory-only

  drive-inventory-trusted:
    # Main-only metadata inspection. Use a separately restricted WIF provider and a
    # reader-only Service Account, in an Environment WITHOUT required reviewers.
    # Do NOT remove protection on the PR-only photo-inventory-qa Environment.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'inventory'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: photo-readonly-automation
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate via trusted main read-only WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PHOTO_WIF_PROVIDER }}
          service_account: ${{ vars.PHOTO_SA_EMAIL }}
          create_credentials_file: true
      - run: python -m pip install google-api-python-client google-auth
      - name: Verify live SOP and inventory all Plot/day metadata (no writes)
        env:
          PHOTO_PLOT_FOLDERS_JSON: ${{ secrets.PHOTO_PLOT_FOLDERS_JSON }}
          PHOTO_ROOT_FOLDER_ID: ${{ secrets.PHOTO_ROOT_FOLDER_ID }}
          PHOTO_SOP_INDEX_ID: ${{ secrets.PHOTO_SOP_INDEX_ID }}
          PHOTO_SOP_DOC_ID: ${{ secrets.PHOTO_SOP_DOC_ID }}
        run: python scripts/progress_photo_fasttrack.py --inventory-only

  drive-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'dry-run'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: photo-readonly-automation
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate via Google Workload Identity Federation (no private key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PHOTO_WIF_PROVIDER }}
          service_account: ${{ vars.PHOTO_SA_EMAIL }}
          create_credentials_file: true
      - run: pip install google-api-python-client google-auth Pillow opencv-python-headless numpy
      - name: Inspect Drive, propose only (no writes)
        env:
          PHOTO_PLOT_FOLDERS_JSON: ${{ secrets.PHOTO_PLOT_FOLDERS_JSON }}
          PHOTO_ROOT_FOLDER_ID: ${{ secrets.PHOTO_ROOT_FOLDER_ID }}
          PHOTO_SOP_INDEX_ID: ${{ secrets.PHOTO_SOP_INDEX_ID }}
          PHOTO_SOP_DOC_ID: ${{ secrets.PHOTO_SOP_DOC_ID }}
          MAX_DAYS: ${{ inputs.max_days }}
        run: python scripts/progress_photo_fasttrack.py --max-days "$MAX_DAYS"

  drive-apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: photo-rename-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate via Google Workload Identity Federation (no private key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PHOTO_WIF_PROVIDER }}
          service_account: ${{ vars.PHOTO_SA_EMAIL }}
          create_credentials_file: true
      - run: pip install google-api-python-client google-auth Pillow opencv-python-headless numpy
      - name: Apply only independently verified pairs, readback and private audit
        env:
          PHOTO_PLOT_FOLDERS_JSON: ${{ secrets.PHOTO_PLOT_FOLDERS_JSON }}
          PHOTO_ROOT_FOLDER_ID: ${{ secrets.PHOTO_ROOT_FOLDER_ID }}
          PHOTO_SOP_INDEX_ID: ${{ secrets.PHOTO_SOP_INDEX_ID }}
          PHOTO_SOP_DOC_ID: ${{ secrets.PHOTO_SOP_DOC_ID }}
          PHOTO_AUDIT_FOLDER_ID: ${{ secrets.PHOTO_AUDIT_FOLDER_ID }}
          PHOTO_VERIFIED_MATCHES_JSON: ${{ secrets.PHOTO_VERIFIED_MATCHES_JSON }}
          PHOTO_WEB_PARSER_VERIFIED: ${{ vars.PHOTO_WEB_PARSER_VERIFIED }}
          PHOTO_ENABLE_WRITE: ${{ vars.PHOTO_ENABLE_WRITE }}
          MAX_DAYS: ${{ inputs.max_days }}
        run: python scripts/progress_photo_fasttrack.py --max-days 0 --max-renames "${{ inputs.max_renames }}" --apply
