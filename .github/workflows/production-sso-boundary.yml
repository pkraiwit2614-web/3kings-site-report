name: Production SSO Boundary Diagnostic (no secrets)
on:
  pull_request:
    paths:
      - '.github/workflows/production-sso-boundary.yml'
      - 'scripts/production-sso-preflight.mjs'
      - 'tests/production-sso-preflight.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate SSO diagnostic fail-closed contract
        run: node --test tests/production-sso-preflight.test.mjs

  production_http:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Classify public SSO boundary without authentication
        run: node scripts/production-sso-preflight.mjs
      - name: Report evidence limit
        run: |
          echo '### Production SSO boundary (no credentials)' >> "$GITHUB_STEP_SUMMARY"
          echo 'This check verifies only HTTP reachability and SSO behavior.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Authenticated browser UI, Defect data and Owner/Viewer RBAC remain NOT_VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
