name: Prompt 15 Attendance Browser E2E

on:
  push:
    branches:
      - fix/prompt15-attendance-evidence-20261005
    paths:
      - '.github/workflows/prompt15-attendance-browser-e2e.yml'
      - 'app/reports/labour/page.tsx'
      - 'tests/payroll/browser-attendance-evidence.cjs'

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, build exact branch, and install Chromium
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact branch locally
        shell: bash
        run: |
          set -euo pipefail
          (npm run start -- -p 3000 > /tmp/prompt15-next.log 2>&1 & echo $! > /tmp/prompt15-next.pid)
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL/reports/labour" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prompt15-next.log
          exit 42
      - name: Run Prompt 15 browser E2E
        run: node tests/payroll/browser-attendance-evidence.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt15-attendance-browser-e2e
          path: prompt15-attendance-e2e.png
          if-no-files-found: ignore
