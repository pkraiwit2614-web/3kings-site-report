name: Sync Owner LINE Monitor — Offline QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'operations/sync-monitor/owner-alerts.mjs'
      - 'operations/sync-monitor/alert-policy.mjs'
      - 'operations/sync-monitor/pipeline-metrics.mjs'
      - 'operations/sync-monitor/source-catalog.mjs'
      - 'operations/sync-monitor/observation-adapters.mjs'
      - 'operations/sync-monitor/log-collector.mjs'
      - 'operations/sync-monitor/pending-tracker.mjs'
      - 'operations/cloudflare/3kings-line-autopilot-owner-only.mjs'
      - 'tests/sync-owner-line-monitor.test.cjs'
      - 'tests/sync-owner-line-alert-policy.test.cjs'
      - 'tests/sync-owner-line-metrics.test.cjs'
      - 'tests/sync-owner-line-source-guard.test.cjs'
      - 'tests/sync-owner-line-observation.test.cjs'
      - 'tests/sync-owner-line-collector.test.cjs'
      - 'tests/sync-owner-line-pending-tracker.test.cjs'
      - 'tests/sync-owner-worker-integration.test.cjs'
      - '.github/workflows/sync-owner-line-notifier-qa.yml'
permissions:
  contents: read
jobs:
  offline_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax QA (no outbound network)
        run: |
          node --check operations/sync-monitor/owner-alerts.mjs
          node --check operations/sync-monitor/alert-policy.mjs
          node --check operations/sync-monitor/pipeline-metrics.mjs
          node --check operations/sync-monitor/source-catalog.mjs
          node --check operations/sync-monitor/observation-adapters.mjs
          node --check operations/sync-monitor/log-collector.mjs
          node --check operations/sync-monitor/pending-tracker.mjs
          node --check operations/cloudflare/3kings-line-autopilot-owner-only.mjs
      - name: New monitor safety, E2E and idempotency mocks
        run: node --test tests/sync-owner-line-monitor.test.cjs tests/sync-owner-line-alert-policy.test.cjs tests/sync-owner-line-metrics.test.cjs tests/sync-owner-line-source-guard.test.cjs tests/sync-owner-line-observation.test.cjs tests/sync-owner-line-collector.test.cjs tests/sync-owner-line-pending-tracker.test.cjs tests/sync-owner-worker-integration.test.cjs
      - name: Existing Daily owner LINE mock regression (no LINE sends)
        run: node --test tests/line-owner-delivery.test.cjs tests/line-owner-bridge.test.cjs
