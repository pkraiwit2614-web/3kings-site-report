name: Daily Site Publish Document QA
on:
  pull_request:
    paths:
      - 'scripts/daily-site-publish-qa.py'
      - 'tests/test_daily_site_publish_qa.py'
      - '.github/workflows/daily-site-publish-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/daily-site-publish-qa.py'
      - 'tests/test_daily_site_publish_qa.py'
jobs:
  isolated-document-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'PyMuPDF==1.26.7' 'Pillow==12.3.0'
      - run: python -m unittest discover -s tests -p 'test_daily_site_publish_qa.py' -v
