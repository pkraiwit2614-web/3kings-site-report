name: CI

on:
  push:
    branches: [main, release/common-ab-live-20261016]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Hotel Work Plan bidirectional Excel safety
        run: node --test tests/hotel-work-plan-excel-bidirectional.test.cjs

      - name: Hotel Work Plan save confirmation and before-after review
        run: node --test tests/hotel-work-plan-save-dialog.test.cjs

      - name: Hotel Work Plan schedule and scoped editor safety
        run: node --test tests/hotel-work-plan.test.cjs

      - name: Work Plan Defect status, Combine groups and column order regression
        run: node --test tests/hotel-work-plan-status-combine.test.cjs

      - name: Hotel OOO/OOS room mapping and security regression
        run: node tests/hotel-room-availability.test.cjs

      - name: Combine room save, search, print, and role regression
        run: node tests/combine-room-group-edit.test.cjs

      - name: Hotel Excel OOO/OOS pinned source safety
        run: node --test tests/hotel-ooo-excel-source.test.cjs

      - name: Common Area A+B read-only report and source regression
        run: node --test tests/common-defect-report-ab.test.cjs

      - name: Defect canonical source contract
        run: node tests/defect-canonical-source.test.cjs

      - name: Hotel-only Combine=1 Flow regression
        run: node --test tests/hotel-combine-one-tab.test.cjs

      - name: Internal Work Order Viewer and Print safety
        run: node --test tests/work-order-viewer.test.cjs

      - name: Work Order sticky header, Combine and Excel sync safety
        run: node --test tests/work-order-auto-sync.test.cjs

      - name: Defect Report update timestamp source and security regression
        run: node --test tests/defect-report-last-change.test.cjs

      - name: Defect work, first/latest dates, count and print safety
        run: node --test tests/defect-detail-summary.test.cjs

      - name: Defect Excel writeback XML and queue safety
        run: node tests/defect-excel-writeback.test.cjs

      - name: Shift sync and Defect revision safeguards
        run: node --test tests/sync-shift-and-defect-revision.test.cjs

      - name: Stability regression tests
        run: node tests/stability.test.cjs

      - name: Complete role matrix regression tests
        run: node tests/role-matrix.test.cjs

      - name: Permission Matrix default regression
        run: node tests/role-permission-matrix-ui.test.cjs

      - name: RBAC regression tests
        run: node tests/rbac.test.cjs

      - name: Optional self-service password change safety
        run: node --test tests/optional-password-change.test.cjs

      - name: Shared Viewer Auth MFA lock and Owner reset protection
        run: node --test tests/shared-viewer-auth-lock.test.cjs

      - name: Activity Log security regression tests
        run: node tests/activity-log.test.cjs

      - name: Defect ingest validation regression
        run: node tests/defect-ingest-validation.test.cjs

      - name: Prompt 23 labour/payroll QA
        run: node --test tests/prompt23/labour-payroll.test.cjs

      - name: Prompt 12 headcount reconciliation tests
        run: node tests/headcount-reconciliation.test.cjs

      - name: Prompt 3 source revision invalidation tests
        run: node --test tests/payroll/source-revision-invalidation.test.cjs

      - name: Prompt 4 optimistic concurrency tests
        run: node --test tests/payroll/optimistic-concurrency.test.cjs

      - name: Prompt 5 manpower reconciliation tests
        run: node --test tests/prompt5-manpower-reconciliation.test.cjs

      - name: Prompt 13 canonical duplicate tests
        run: node --test tests/prompt13-canonical-duplicates.test.cjs

      - name: Prompt 15 attendance evidence tests
        run: node --test tests/payroll/attendance-evidence.test.cjs

      - name: Admin role preview regression tests
        run: node tests/role-preview.test.cjs

      - name: Google Calendar live edit regression
        run: node tests/google-calendar-live-edit.test.cjs
      - name: Calendar procurement date/permission guard regression
        run: node tests/calendar-procurement-integration.test.cjs

      # Validate live Materials print table columns, repeating headers and page-width allocation.
      - name: Materials print pagination regression
        run: node tests/materials-print-layout.test.cjs


      - name: Editable permission defaults and confirmed save workflow
        run: node --test tests/editable-role-matrix.test.cjs tests/editable-role-matrix-ui.test.cjs tests/access-role-preview-hook.test.cjs

      - name: LINE AutoPilot webhook signature and private/site routing
        run: node --test tests/line-autopilot-webhook.test.cjs

      - name: LINE AutoPilot five alert types, strict recipient and no-send safeguards
        run: node --test tests/line-autopilot-five-types.test.cjs

      - name: Cloudflare LINE AutoPilot staging receiver and default-off tests
        run: node --test tests/line-autopilot-cloudflare.test.cjs

      - name: Cloudflare isolated Worker live staging health smoke
        run: |
          node --input-type=module -e "const r=await fetch('https://3kings-line-autopilot.p-kraiwit2614.workers.dev/health',{signal:AbortSignal.timeout(15000)}); const j=await r.json(); if(!r.ok||j.service!=='3kings-line-autopilot'||j.live!==false||j.mode!=='staged_no_send') process.exit(1); console.log('Cloudflare staged health PASS, outgoing messaging disabled')"
