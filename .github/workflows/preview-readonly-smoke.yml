name: Preview HTTP Reachability (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/preview-readonly-smoke.yml'
      - 'scripts/preview-readonly-smoke.mjs'
      - 'tests/preview-readonly-smoke.test.mjs'
  deployment_status:

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Preview URL allowlist and fail-closed behavior
        run: node --test tests/preview-readonly-smoke.test.mjs

  probe:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Preview' ||
       github.event.deployment.environment == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Use reviewed default-branch implementation, NOT code checked out from
      # the Preview deployment's potentially unreviewed commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show nonsecret deployment identity for trust review
        env:
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          DEPLOY_REPO: ${{ github.event.repository.full_name }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "deployment.ref=$DEPLOY_REF"
          echo "deployment.repo=$DEPLOY_REPO"
          echo "deployment.sha=$DEPLOY_SHA"
      - name: Require reviewed checker on default branch before using any bypass credential
        run: |
          if [ ! -f scripts/preview-readonly-smoke.mjs ]; then
            echo "::error::BLOCK_PREVIEW_RUNNER_NOT_MERGED_ON_MAIN"
            exit 1
          fi
      - name: Probe Vercel Preview with dedicated automation credential
        env:
          PREVIEW_ENV_URL: ${{ github.event.deployment_status.environment_url }}
          PREVIEW_STATUS_URL: ${{ github.event.deployment_status.target_url }}
          KINGS_VERCEL_PREVIEW_BYPASS: ${{ secrets.KINGS_VERCEL_PREVIEW_BYPASS }}
        run: node scripts/preview-readonly-smoke.mjs
